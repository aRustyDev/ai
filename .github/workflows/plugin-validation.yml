---
name: Plugin Validation

on:
  push:
    branches: [main]
    paths:
      - 'content/plugins/**'
      - 'content/skills/**'
      - 'content/commands/**'
      - 'content/agents/**'
      - 'cli/build-plugin.py'
      - 'cli/plugin-hash.py'
  pull_request:
    branches: [main]
    paths:
      - 'content/plugins/**'
      - 'content/skills/**'
      - 'content/commands/**'
      - 'content/agents/**'
      - 'cli/build-plugin.py'
      - 'cli/plugin-hash.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --quiet

      - name: Validate all plugins
        run: uv run python cli/build-plugin.py check-all

      - name: Build all plugins (check-only)
        run: uv run python cli/build-plugin.py build-all --check-only
